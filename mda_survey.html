<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morro dos Anjos — Bem-vindo(a)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1D1E46;
    --bg-2:#2a2c6e;
    --accent:#00AEEF;
    --accent-2:#8DE0F2;
    --cream:#FFF7E6;
    --gold:#CB9C66;
    --coral:#F27466;
    --rose:#FAA0AA;
    --teal:#29948F;
    --teal-d:#124747;
    --line:rgba(255,255,255,.14);
    --line-2:rgba(255,255,255,.28);
    --muted:rgba(255,255,255,.6);
    --soft:rgba(255,255,255,.05);
    --soft-2:rgba(255,255,255,.1);
    --sans:'Manrope',system-ui,-apple-system,Roboto,sans-serif;
    --serif:'Cormorant Garamond',Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% 0%, #2a2c6e 0%, #1D1E46 55%, #14153a 100%);
    background-attachment:fixed;
    color:#fff;
    font-family:var(--sans);
    line-height:1.55;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:#fff}
  button{font-family:inherit}

  /* TOP BAR */
  .topbar{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(14px);
    background:rgba(20,21,58,.7);
    border-bottom:1px solid var(--line);
    display:none;
  }
  .topbar.show{display:block}
  .topbar-inner{
    max-width:1080px;margin:0 auto;
    padding:14px 24px;display:flex;align-items:center;gap:18px;
  }
  .brandmark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
  .brandmark img{height:28px;width:auto;display:block}
  .progress-wrap{flex:1;display:flex;align-items:center;gap:14px}
  .progress-bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cream));width:0;transition:width .5s}
  .progress-count{font-family:var(--serif);font-style:italic;color:var(--cream);font-size:1rem;min-width:62px;text-align:right}
  .skip-q{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 14px;border-radius:999px;cursor:pointer;
    font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
    transition:.2s;
  }
  .skip-q:hover{color:#fff;border-color:#fff}

  /* WELCOME */
  .welcome{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 24px 80px;text-align:center;
    position:relative;
  }
  .logo-mark{width:120px;margin:0 auto 36px;display:block;animation:floaty 6s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .welcome h1{
    font-family:var(--sans);
    font-weight:800;
    font-size:clamp(2.2rem,6vw,4rem);
    line-height:1.05;
    letter-spacing:-.028em;
    margin:0 auto 28px;
    max-width:18ch;
  }
  .welcome h1 em{
    font-family:var(--serif);font-style:italic;font-weight:600;
    color:var(--accent-2);font-size:1.05em;
  }
  .welcome .lead{
    max-width:580px;
    font-size:clamp(1rem,1.6vw,1.12rem);
    color:rgba(255,255,255,.82);
    line-height:1.7;margin:0 auto 22px;
  }
  .welcome .lead + .lead{margin-top:0}
  .time-badge{
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 18px;border:1px solid var(--line-2);
    border-radius:999px;font-size:.86rem;color:#fff;
    background:rgba(0,174,239,.08);margin-top:14px;
  }

  .cta-pill{
    margin-top:40px;
    background:var(--cream);color:var(--bg);
    border:none;cursor:pointer;
    padding:20px 42px;border-radius:999px;
    font-weight:700;font-size:.84rem;
    letter-spacing:.22em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:14px;
    transition:.25s;box-shadow:0 18px 40px rgba(0,0,0,.3);
  }
  .cta-pill:hover{transform:translateY(-3px);box-shadow:0 24px 50px rgba(0,0,0,.4)}
  .cta-pill .arr{transition:transform .25s}
  .cta-pill:hover .arr{transform:translateX(5px)}

  .privacy{margin-top:14px;font-size:.78rem;color:var(--muted);max-width:480px}
  .consent{margin:24px auto 0;max-width:520px;text-align:left}
  .consent-row{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font-size:.82rem;line-height:1.5;color:rgba(255,255,255,.78)}
  .consent-row input[type=checkbox]{margin-top:3px;flex-shrink:0;width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .consent-row strong{color:#fff;font-weight:600}

  /* STAGE */
  .form-wrap{display:none;padding:60px 24px 120px}
  .form-wrap.show{display:block}
  .form-inner{max-width:880px;margin:0 auto}

  .stage{display:none;animation:fade .45s ease}
  .stage.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .stage-eyebrow{
    font-family:var(--sans);
    font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--cream);font-weight:600;
    display:inline-flex;align-items:center;gap:14px;margin-bottom:22px;
  }
  .stage-eyebrow::before{content:"";width:36px;height:1px;background:var(--cream);opacity:.6}
  .stage h2{
    font-family:var(--sans);
    font-weight:800;
    font-size:clamp(2.4rem,6vw,4.2rem);
    line-height:1.02;letter-spacing:-.028em;
    margin:0 0 18px;
    max-width:18ch;
  }
  .stage h2 em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--accent-2)}
  .stage-intro{
    color:rgba(255,255,255,.7);
    font-size:1.06rem;max-width:56ch;margin-bottom:42px;
  }

  /* SOLO INPUTS */
  .input-solo{
    width:100%;background:transparent;
    border:none;border-bottom:2px solid var(--line-2);
    color:#fff;font-family:var(--serif);font-style:italic;
    font-size:clamp(1.6rem,3.4vw,2.4rem);
    padding:14px 0;outline:none;transition:.2s;
  }
  .input-solo::placeholder{color:rgba(255,255,255,.28)}
  .input-solo:focus{border-bottom-color:var(--accent)}

  .duo-fields{display:grid;gap:24px}
  .field-line{display:flex;flex-direction:column;gap:6px}
  .field-line label{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);font-weight:600}
  .field-line input{
    background:transparent;border:none;
    border-bottom:2px solid var(--line-2);
    color:#fff;font-family:var(--serif);font-style:italic;
    font-size:clamp(1.4rem,2.8vw,2rem);padding:10px 0;outline:none;transition:.2s;
  }
  .field-line input:focus{border-bottom-color:var(--accent)}
  .field-line input::placeholder{color:rgba(255,255,255,.28)}
  .field-line input[type=date]{font-family:var(--sans);font-style:normal;font-size:1.2rem;color-scheme:dark}

  /* DETAILS GRID (merged step) */
  .details-grid{
    display:grid;gap:30px 32px;
    grid-template-columns:repeat(2,1fr);
  }
  @media (max-width:720px){
    .details-grid{grid-template-columns:1fr;gap:22px}
  }

  /* BIRTHDAY SELECTS */
  .birth-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .birth-sel{
    flex:1;min-width:80px;
    background:transparent;
    border:none;border-bottom:2px solid var(--line-2);
    color:#fff;font-family:var(--serif);font-style:italic;
    font-size:1.5rem;padding:10px 0;outline:none;transition:.2s;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='8' viewBox='0 0 14 8' fill='none' stroke='%23ffffff80' stroke-width='2' stroke-linecap='round'%3e%3cpath d='M1 1l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat:no-repeat;background-position:right 4px center;
    padding-right:22px;cursor:pointer;
  }
  .birth-sel:focus{border-bottom-color:var(--accent)}
  .birth-sel option{background:var(--bg);color:#fff;font-family:var(--sans);font-style:normal;font-size:.95rem}

  /* CARD GRID */
  .cards{
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  }
  .cards.large{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

  .card{
    position:relative;cursor:pointer;
    aspect-ratio:1.25/1;
    border-radius:22px;
    overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:20px;
    transition:.28s cubic-bezier(.2,.7,.3,1);
    border:1px solid transparent;
    user-select:none;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:var(--g,linear-gradient(135deg,#29948F,#124747));
    opacity:.95;transition:.3s;
  }
  .card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.35) 100%);
    pointer-events:none;
  }
  .card:hover{transform:translateY(-5px)}
  .card:hover::before{opacity:1}
  .card.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 24px 40px rgba(0,0,0,.4);transform:translateY(-3px)}

  .card .num{
    position:absolute;top:14px;left:14px;z-index:2;
    width:28px;height:28px;border-radius:8px;
    background:rgba(255,255,255,.95);color:#1D1E46;
    display:grid;place-items:center;
    font-weight:800;font-size:.82rem;
  }
  .card .emo{position:absolute;top:14px;right:18px;z-index:2;font-size:2.2rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
  .card .meta{position:relative;z-index:2;color:#fff}
  .card .meta .t{
    font-weight:800;font-size:1.18rem;
    text-transform:uppercase;letter-spacing:-.005em;line-height:1.05;
  }
  .card .meta .s{
    font-family:var(--serif);font-style:italic;
    font-size:1.05rem;margin-top:6px;font-weight:500;
    opacity:.92;
  }
  .card .check{
    position:absolute;top:14px;right:14px;z-index:3;
    width:28px;height:28px;border-radius:50%;
    background:#fff;color:#1D1E46;
    display:none;place-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }
  .card.selected .check{display:grid}
  .card.selected .emo{display:none}

  .g-coral{--g:linear-gradient(135deg,#F27466,#FAA0AA)}
  .g-rose{--g:linear-gradient(135deg,#FAA0AA,#F27466 80%)}
  .g-blue{--g:linear-gradient(135deg,#00AEEF,#1D3C73)}
  .g-teal{--g:linear-gradient(135deg,#29948F,#124747)}
  .g-mint{--g:linear-gradient(135deg,#8DE0F2,#29948F)}
  .g-gold{--g:linear-gradient(135deg,#CB9C66,#A87C4B)}
  .g-cream{--g:linear-gradient(135deg,#FFF7E6,#CB9C66)}
  .g-navy{--g:linear-gradient(135deg,#1D3C73,#1D1E46)}
  .g-sun{--g:linear-gradient(135deg,#FAA0AA,#CB9C66)}
  .g-night{--g:linear-gradient(135deg,#1D1E46,#124747)}
  .g-ocean{--g:linear-gradient(135deg,#00AEEF,#29948F)}
  .g-cream .meta,.g-cream .num,.g-cream .meta .t,.g-cream .meta .s{color:#1D1E46}

  /* AUDIO */
  .audio-box{
    border:1px dashed var(--line-2);background:var(--soft);
    border-radius:18px;padding:22px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .audio-btn{
    background:var(--accent);color:var(--bg);
    border:none;border-radius:999px;padding:13px 24px;
    font-weight:800;letter-spacing:.06em;font-size:.86rem;
    cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:.2s;
  }
  .audio-btn.recording{background:var(--coral);color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 10px rgba(242,116,102,.25)}}
  .audio-status{font-size:.86rem;color:var(--muted)}
  .audio-box audio{flex:1;min-width:200px}

  /* UPLOAD */
  .uploader{
    border:1.5px dashed var(--line-2);background:var(--soft);
    border-radius:18px;padding:32px;text-align:center;cursor:pointer;
    transition:.2s;
  }
  .uploader:hover,.uploader.drag{border-color:var(--accent);background:rgba(0,174,239,.06)}
  .uploader input{display:none}
  .uploader .up-title{font-weight:600;font-size:1.05rem;margin-bottom:6px}
  .uploader .up-sub{color:var(--muted);font-size:.88rem}
  .upload-list{margin-top:14px;display:grid;gap:8px}
  .upload-item{
    background:var(--soft-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:.9rem;
  }
  .upload-item .x{margin-left:auto;cursor:pointer;color:var(--muted);background:none;border:none;font-size:1.2rem}
  .upload-item .x:hover{color:var(--coral)}
  .upload-item img{width:40px;height:40px;border-radius:7px;object-fit:cover}

  textarea.solo{
    width:100%;background:var(--soft);border:1px solid var(--line);
    border-radius:14px;padding:16px;color:#fff;font-family:var(--sans);
    font-size:1.05rem;line-height:1.6;min-height:160px;
    transition:.2s;outline:none;
  }
  textarea.solo:focus{border-color:var(--accent);background:var(--soft-2);box-shadow:0 0 0 3px rgba(0,174,239,.18)}
  textarea.solo::placeholder{color:rgba(255,255,255,.36)}

  /* NAV */
  .nav-row{
    margin-top:50px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .btn{
    border:none;cursor:pointer;font-family:inherit;
    padding:16px 32px;border-radius:999px;
    font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;
    transition:.25s;display:inline-flex;align-items:center;gap:10px;
  }
  .btn.primary{background:var(--cream);color:var(--bg)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.35)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid var(--line-2)}
  .btn.ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .nav-spacer{flex:1}

  @keyframes spin{to{transform:rotate(360deg)}}

  /* SUMMARY */
  .summary-box{
    background:var(--soft);border:1px solid var(--line);
    border-radius:22px;padding:30px;margin-bottom:24px;
  }
  .summary-section{padding:14px 0;border-bottom:1px dashed var(--line)}
  .summary-section:last-child{border-bottom:none}
  .summary-section h4{
    margin:0 0 10px;font-size:.74rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--cream);font-weight:600;
  }
  .summary-row{display:flex;gap:14px;padding:5px 0;font-size:.94rem}
  .summary-row .k{color:var(--muted);min-width:170px;font-size:.84rem}
  .summary-row .v{color:#fff;flex:1}

  .voucher{
    margin-top:8px;border:1.5px dashed var(--cream);
    border-radius:28px;padding:34px 32px 32px;
    background:linear-gradient(135deg,rgba(255,247,230,.14),rgba(0,174,239,.08));
    position:relative;overflow:hidden;
  }
  .voucher::before{
    content:"";position:absolute;top:-50px;left:50%;transform:translateX(-50%);
    width:220px;height:90px;background:radial-gradient(ellipse,var(--cream),transparent 70%);
    opacity:.16;pointer-events:none;
  }
  .voucher .v-top{
    display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;
  }
  .voucher .v-logo{width:48px;height:30px;flex-shrink:0}
  .voucher .v-logo img{width:auto;height:100%;display:block}
  .voucher .v-eyebrow{
    font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--cream);font-weight:700;
  }
  .voucher h3{
    font-family:var(--sans);font-weight:800;
    font-size:clamp(1.5rem,4.4vw,2.3rem);
    margin:6px 0 8px;letter-spacing:-.018em;text-align:center;
  }
  .voucher h3 em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--accent-2)}
  .voucher .v-sub{
    text-align:center;color:rgba(255,255,255,.8);
    font-size:.98rem;line-height:1.55;margin:0 auto 18px;max-width:42ch;
  }
  .voucher .v-divider{
    height:1px;background:var(--line-2);margin:22px -32px;position:relative;
  }
  .voucher .v-divider::before,
  .voucher .v-divider::after{
    content:"";position:absolute;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;background:#1d2153;
  }
  .voucher .v-divider::before{left:-11px}
  .voucher .v-divider::after{right:-11px}
  .voucher .v-guest-label{
    font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
    text-align:center;color:var(--muted);margin-top:8px;
  }
  .voucher .v-guest{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(1.5rem,3.6vw,2rem);
    text-align:center;color:#fff;margin:6px 0 4px;letter-spacing:.01em;
  }
  .voucher .v-meta{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px 28px;
    margin-top:22px;font-size:.82rem;color:#fff;
  }
  .voucher .v-meta > div{flex:1;min-width:120px}
  .voucher .v-meta b{
    display:block;color:var(--cream);font-weight:700;
    letter-spacing:.18em;font-size:.66rem;text-transform:uppercase;margin-bottom:4px;
  }
  .voucher .v-instr{
    margin-top:22px;padding:18px 20px;border-radius:14px;
    background:rgba(0,174,239,.1);border:1px solid rgba(0,174,239,.3);
    color:#fff;text-align:center;font-size:.96rem;line-height:1.6;
  }
  .voucher .v-instr strong{color:var(--accent-2);font-weight:700}
  @media (max-width:540px){
    .voucher{padding:28px 22px}
    .voucher .v-divider{margin:20px -22px}
    .voucher .v-meta{flex-direction:column;gap:14px}
  }

  .links-grid{
    display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    margin-top:24px;
  }
  .link-card{
    background:var(--soft);border:1px solid var(--line);border-radius:16px;
    padding:20px;text-decoration:none;color:#fff;
    transition:.25s;display:flex;flex-direction:column;gap:6px;
  }
  .link-card:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--soft-2)}
  .link-card .lc-eyebrow{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cream)}
  .link-card .lc-title{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:#fff}
  .link-card .lc-sub{font-size:.82rem;color:var(--muted)}

  .toast{
    position:fixed;bottom:30px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--cream);color:var(--bg);
    padding:14px 24px;border-radius:999px;
    font-weight:600;font-size:.86rem;letter-spacing:.04em;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
    opacity:0;transition:.3s;pointer-events:none;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}
  .confetti.show{display:block}
  .confetti span{
    position:absolute;top:-20px;width:10px;height:14px;
    animation:fall 3s linear forwards;
  }
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  @media (max-width:720px){
    .topbar-inner{padding:12px 16px;gap:10px}
    .brandmark span{display:none}
    .progress-count{min-width:54px;font-size:.88rem}
    .skip-q{padding:5px 10px;font-size:.66rem;letter-spacing:.1em}
    .welcome{padding:48px 22px 60px}
    .form-wrap{padding:42px 20px 90px}
    .cards{gap:10px;grid-template-columns:repeat(2,1fr)}
    .cards.large{grid-template-columns:repeat(2,1fr)}
    .card{aspect-ratio:1/1;padding:14px;border-radius:18px}
    .card .meta .t{font-size:.96rem}
    .card .meta .s{font-size:.88rem}
    .card .emo{font-size:1.7rem;top:10px;right:12px}

<script>
/* ─────────────────────────────────────────────────────
   INTEGRAÇÃO GOOGLE SHEETS
   Substitua a URL abaixo pela URL do seu Web App Apps Script
   ───────────────────────────────────────────────────── */
const SUBMIT_ENDPOINT = 'COLE_AQUI_A_URL_DO_WEB_APP_APPS_SCRIPT';

const STORAGE_KEY='mda_profile_v3';
const state=loadState();
function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):{}}catch(e){return{}}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400)}

/* ─────────────────────────────────────────────────────
   ENVIO PARA GOOGLE SHEETS
   ───────────────────────────────────────────────────── */
async function submitAndAdvance(idx){
  /* Já enviado → apenas avança para o voucher */
  if(state.submitted){goTo(idx+1);return;}

  /* Validação */
  const name=(state.name||'').trim();
  const email=(state.email||'').trim();
  if(!name){toast('Por favor, informe seu nome (etapa 01) antes de continuar.');return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Por favor, informe um e-mail válido (etapa 02) antes de continuar.');return;}

  /* Referência ao botão do nav */
  const btn=document.getElementById('storyNavBtn');
  const SPINNER='<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(29,30,70,.25);border-top-color:#1D1E46;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px"></span>';
  if(btn){btn.disabled=true;btn.innerHTML=SPINNER+'Enviando…';}

  /* Monta payload */
  const payload={
    submitted_at     : new Date().toISOString(),
    voucher_code     : state.voucher_code||'',
    consent_lgpd     : state.consent_lgpd?'Sim':'Não',
    name, email,
    phone            : state.phone||'',
    birthday         : state.birthday||'',
    city             : state.city||'',
    profession       : state.profession||'',
    how_heard        : arrayToString(state.how_heard),
    how_heard_other  : state.how_heard_other||'',
    companions       : arrayToString(state.companions),
    kids             : arrayToString(state.kids),
    occasion         : arrayToString(state.occasion),
    food_styles      : arrayToString(state.food_styles),
    restrictions     : state.restrictions||'',
    drink            : arrayToString(state.drink),
    breakfast        : arrayToString(state.breakfast),
    day_activities   : arrayToString(state.day_activities),
    sport            : arrayToString(state.sport),
    team             : state.team||'',
    night_vibe       : arrayToString(state.night_vibe),
    music_taste      : arrayToString(state.music_taste),
    channel          : arrayToString(state.channel),
    dream_attractions: arrayToString(state.dream_attractions),
    world_travel     : arrayToString(state.world_travel),
    vacation_club    : arrayToString(state.vacation_club),
    story            : state.story||'',
    story_audio      : state.story_audio||'',
    uploads_count    : (state.uploads&&state.uploads.length)?state.uploads.length:0,
    user_agent       : navigator.userAgent,
    raw_json         : JSON.stringify(state)
  };

  /* Dispara o POST */
  try{
    await fetch(SUBMIT_ENDPOINT,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    /* no-cors → resposta opaque; ausência de exceção = sucesso */
    state.submitted=true;
    saveState();
    goTo(idx+1); /* avança para o voucher */
  }catch(err){
    console.error('submitAndAdvance error:',err);
    if(btn){btn.disabled=false;btn.innerHTML='Enviar &amp; liberar cortesia &rarr;';}
    toast('Não conseguimos enviar agora. Verifique sua conexão e tente novamente.');
  }
}

function arrayToString(v){
  if(!v)return '';
  if(Array.isArray(v))return v.join(', ');
  return String(v);
}

const formInner=document.getElementById('formInner');

function buildStages(){
  formInner.innerHTML='';
  STAGES.forEach((stage,idx)=>{
    const sec=document.createElement('section');
    sec.className='stage'+(idx===0?' active':'');
    sec.dataset.idx=idx;sec.dataset.id=stage.id;
    let html=`<div class="stage-eyebrow">${stage.eyebrow}</div><h2>${stage.title}</h2>`;
    if(stage.intro)html+=`<p class="stage-intro">${stage.intro}</p>`;
    sec.innerHTML=html;

    if(stage.type==='input'){
      const i=document.createElement('input');
      i.className='input-solo';i.type=stage.inputType||'text';i.id='q_'+stage.id;
      i.placeholder=stage.placeholder||'';
      i.addEventListener('input',e=>{state[stage.id]=e.target.value;saveState();});
      i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryAdvance(idx);}});
      sec.appendChild(i);
    }
    else if(stage.type==='duo'){
      const wrap=document.createElement('div');wrap.className='duo-fields';
      stage.fields.forEach(f=>{
        const fl=document.createElement('div');fl.className='field-line';
        fl.innerHTML=`<label>${f.label}</label>`;
        const i=document.createElement('input');i.id='q_'+f.id;i.type=f.type;i.placeholder=f.placeholder||'';
        i.addEventListener('input',e=>{state[f.id]=e.target.value;saveState();});
        fl.appendChild(i);wrap.appendChild(fl);
      });
      sec.appendChild(wrap);
    }
    else if(stage.type==='details'){
      const wrap=document.createElement('div');wrap.className='details-grid';
      stage.fields.forEach(f=>{
        const fl=document.createElement('div');fl.className='field-line';
        fl.innerHTML=`<label>${f.label}</label>`;
        if(f.type==='birthdate'){
          fl.appendChild(buildBirthdate(f.id));
        } else {
          const i=document.createElement('input');
          i.id='q_'+f.id;i.type=f.type;i.placeholder=f.placeholder||'';
          i.addEventListener('input',e=>{state[f.id]=e.target.value;saveState();});
          fl.appendChild(i);
        }
        wrap.appendChild(fl);
      });
      sec.appendChild(wrap);
    }
    else if(stage.type==='choice'){
      const grid=document.createElement('div');
      grid.className='cards'+(stage.options.length<=5?' large':'');
      stage.options.forEach((opt,i)=>{
        const c=document.createElement('div');
        c.className='card '+(opt.g||'g-teal');
        c.dataset.value=opt.v;c.dataset.qid=stage.id;
        c.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>
                     <span class="emo">${opt.emo||'✦'}</span>
                     <span class="check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
                     <div class="meta"><div class="t">${opt.t}</div><div class="s">${opt.s||''}</div></div>`;
        c.addEventListener('click',()=>{
          if(stage.multi){
            state[stage.id]=state[stage.id]||[];
            const has=state[stage.id].includes(opt.v);
            if(has)state[stage.id]=state[stage.id].filter(x=>x!==opt.v);
            else state[stage.id].push(opt.v);
            c.classList.toggle('selected',!has);
          } else {
            state[stage.id]=opt.v;
            [...grid.querySelectorAll('.card')].forEach(cc=>cc.classList.toggle('selected',cc.dataset.value===opt.v));
            let shouldAdvance=true;
            if(stage.otherField){
              const isOutro=opt.v==='outro';
              const ofWrap=document.getElementById('of_'+stage.id);
              if(ofWrap)ofWrap.style.display=isOutro?'block':'none';
              const navBtn=sec.querySelector('.nav-next');
              if(navBtn)navBtn.style.display=isOutro?'inline-flex':'none';
              if(isOutro){
                const ofInput=document.getElementById('q_'+stage.otherField);
                setTimeout(()=>ofInput&&ofInput.focus(),120);
                shouldAdvance=false;
              }
            }
            if(shouldAdvance)setTimeout(()=>goTo(idx+1),420);
          }
          saveState();
        });
        grid.appendChild(c);
      });
      sec.appendChild(grid);
      if(stage.otherField){
        const ofWrap=document.createElement('div');
        ofWrap.id='of_'+stage.id;
        ofWrap.style.cssText='margin-top:28px;display:'+(state[stage.id]==='outro'?'block':'none');
        const lbl=document.createElement('label');
        lbl.style.cssText='display:block;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);font-weight:600;margin-bottom:8px';
        lbl.textContent='Conte mais (opcional)';
        const inp=document.createElement('input');
        inp.id='q_'+stage.otherField;
        inp.type='text';
        inp.className='input-solo';
        inp.style.fontSize='1.3rem';
        inp.placeholder='Como você ficou sabendo?';
        inp.addEventListener('input',e=>{state[stage.otherField]=e.target.value;saveState();});
        ofWrap.appendChild(lbl);
        ofWrap.appendChild(inp);
        sec.appendChild(ofWrap);
      }
    }
    else if(stage.type==='story'){
      const ta=document.createElement('textarea');
      ta.className='solo';ta.id='q_story';ta.placeholder='Sugestões, elogios, ideias, sonhos que gostaria de viver aqui…';
      ta.addEventListener('input',e=>{state.story=e.target.value;saveState();});
      sec.appendChild(ta);
      const lbl=document.createElement('div');
      lbl.style.cssText='margin:24px 0 12px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);font-weight:600';
      lbl.textContent='OU GRAVE EM ÁUDIO (OPCIONAL)';
      sec.appendChild(lbl);
      sec.appendChild(buildAudio('story_audio'));

      const lbl2=document.createElement('div');
      lbl2.style.cssText='margin:28px 0 12px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);font-weight:600';
      lbl2.textContent='ANEXOS (OPCIONAL)';
      sec.appendChild(lbl2);
      sec.appendChild(buildUploader('uploads'));

    }
    else if(stage.type==='summary'){
      sec.appendChild(buildSummaryArea());
    }

    sec.appendChild(buildNav(idx));
    formInner.appendChild(sec);
  });
  updateProgress();hydrateValues();
}

function buildBirthdate(key){
  const wrap=document.createElement('div');wrap.className='birth-row';
  const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const yNow=new Date().getFullYear();
  const dSel=document.createElement('select');dSel.className='birth-sel';dSel.id='q_'+key+'_d';
  dSel.innerHTML='<option value="">Dia</option>'+Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  const mSel=document.createElement('select');mSel.className='birth-sel';mSel.id='q_'+key+'_m';
  mSel.innerHTML='<option value="">Mês</option>'+months.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  const ySel=document.createElement('select');ySel.className='birth-sel';ySel.id='q_'+key+'_y';
  ySel.innerHTML='<option value="">Ano</option>'+Array.from({length:90},(_,i)=>`<option value="${yNow-i-12}">${yNow-i-12}</option>`).join('');
  function update(){
    const d=dSel.value,m=mSel.value,y=ySel.value;
    if(d&&m){
      state[key]=y?`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`:`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`;
    } else {state[key]='';}
    saveState();
  }
  [dSel,mSel,ySel].forEach(s=>s.addEventListener('change',update));
  wrap.appendChild(dSel);wrap.appendChild(mSel);wrap.appendChild(ySel);
  return wrap;
}

function buildAudio(key){
  const b=document.createElement('div');b.className='audio-box';
  b.innerHTML=`<button type="button" class="audio-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg><span class="audio-label">Gravar</span></button><div class="audio-status">Toque em gravar para começar</div><audio controls style="display:none"></audio>`;
  const btn=b.querySelector('.audio-btn'),lab=b.querySelector('.audio-label'),st=b.querySelector('.audio-status'),au=b.querySelector('audio');
  let mr=null,ck=[];
  btn.addEventListener('click',async()=>{
    if(btn.classList.contains('recording')){mr&&mr.stop();btn.classList.remove('recording');lab.textContent='Gravar de novo';st.textContent='Gravação salva ✓';return;}
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(s);ck=[];
      mr.ondataavailable=e=>ck.push(e.data);
      mr.onstop=()=>{const bl=new Blob(ck,{type:'audio/webm'});au.src=URL.createObjectURL(bl);au.style.display='block';state[key]='[gravado em '+new Date().toLocaleString('pt-BR')+']';saveState();s.getTracks().forEach(t=>t.stop());};
      mr.start();btn.classList.add('recording');lab.textContent='Parar';st.textContent='Gravando…';
    }catch(e){st.textContent='Permissão de microfone negada.';}
  });
  return b;
}

function buildUploader(key){
  const w=document.createElement('div');
  const u=document.createElement('label');u.className='uploader';
  u.innerHTML=`<input type="file" multiple accept="image/*,application/pdf,audio/*"><div class="up-title">Solte arquivos aqui ou toque para escolher</div><div class="up-sub">Imagens, PDFs ou áudios — o que quiser compartilhar</div>`;
  const list=document.createElement('div');list.className='upload-list';
  state[key]=state[key]||[];
  function render(){
    list.innerHTML='';
    state[key].forEach((f,i)=>{
      const it=document.createElement('div');it.className='upload-item';
      const isImg=f.type&&f.type.startsWith('image');
      it.innerHTML=(isImg?`<img src="${f.dataUrl}">`:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>')+`<span>${f.name} <small style="color:var(--muted)">· ${(f.size/1024).toFixed(0)} KB</small></span><button type="button" class="x" data-i="${i}">×</button>`;
      list.appendChild(it);
    });
    list.querySelectorAll('.x').forEach(b=>b.addEventListener('click',()=>{state[key].splice(+b.dataset.i,1);saveState();render();}));
  }
  function ingest(files){[...files].forEach(file=>{const r=new FileReader();r.onload=e=>{state[key].push({name:file.name,size:file.size,type:file.type,dataUrl:e.target.result});saveState();render();};r.readAsDataURL(file);});}
  u.querySelector('input').addEventListener('change',e=>ingest(e.target.files));
  u.addEventListener('dragover',e=>{e.preventDefault();u.classList.add('drag');});
  u.addEventListener('dragleave',()=>u.classList.remove('drag'));
  u.addEventListener('drop',e=>{e.preventDefault();u.classList.remove('drag');ingest(e.dataTransfer.files);});
  w.appendChild(u);w.appendChild(list);render();return w;
}

function buildNav(idx){
  const r=document.createElement('div');r.className='nav-row';
  const last=idx===STAGES.length-1,first=idx===0,stage=STAGES[idx];
  if(!first){const p=document.createElement('button');p.className='btn ghost';p.type='button';p.innerHTML='&larr; Voltar';p.addEventListener('click',()=>goTo(idx-1));r.appendChild(p);}
  const sp=document.createElement('div');sp.className='nav-spacer';r.appendChild(sp);
  const isSingleChoice=stage.type==='choice'&&!stage.multi;
  const isStory=stage.type==='story';
  const needsNext=!last && (!isSingleChoice || stage.otherField);
  if(needsNext){
    const n=document.createElement('button');n.className='btn primary nav-next';n.type='button';
    if(isStory){
      /* Botão de envio integrado ao nav */
      n.id='storyNavBtn';
      n.innerHTML=(state.submitted?'Ver minha cortesia':'Enviar &amp; liberar cortesia')+' &rarr;';
      n.addEventListener('click',()=>submitAndAdvance(idx));
    } else {
      n.innerHTML='Próximo &rarr;';
      n.addEventListener('click',()=>tryAdvance(idx));
    }
    if(isSingleChoice && stage.otherField && state[stage.id]!=='outro'){
      n.style.display='none';
    }
    r.appendChild(n);
  }
  return r;
}

function tryAdvance(idx){
  const stage=STAGES[idx];
  if(stage.required&&!state[stage.id]){toast('Por favor preencha este campo');const el=document.getElementById('q_'+stage.id);el&&el.focus();return;}
  if(idx<STAGES.length-1)goTo(idx+1);
}

function goTo(i){
  formInner.querySelectorAll('.stage').forEach((s,idx)=>s.classList.toggle('active',idx===i));
  if(STAGES[i].type==='summary'){renderSummary();fireConfetti();}
  updateProgress();window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{
    const stage=STAGES[i];
    if(stage.type==='input'){const el=document.getElementById('q_'+stage.id);el&&el.focus();}
    else if(stage.type==='duo'||stage.type==='details'){const el=document.getElementById('q_'+stage.fields[0].id);el&&el.focus();}
  },300);
}

function updateProgress(){
  let a=0;formInner.querySelectorAll('.stage').forEach((s,i)=>{if(s.classList.contains('active'))a=i;});
  const pct=((a+1)/STAGES.length)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressCount').textContent=String(a+1).padStart(2,'0')+' / '+String(STAGES.length).padStart(2,'0');
}

function hydrateValues(){
  STAGES.forEach(stage=>{
    if(stage.type==='input'){const v=state[stage.id];if(v!=null){const el=document.getElementById('q_'+stage.id);if(el)el.value=v;}}
    else if(stage.type==='duo'){stage.fields.forEach(f=>{const v=state[f.id];if(v!=null){const el=document.getElementById('q_'+f.id);if(el)el.value=v;}});}
    else if(stage.type==='details'){stage.fields.forEach(f=>{
      const v=state[f.id];if(v==null)return;
      if(f.type==='birthdate'){
        const parts=String(v).split('/');
        const dEl=document.getElementById('q_'+f.id+'_d');
        const mEl=document.getElementById('q_'+f.id+'_m');
        const yEl=document.getElementById('q_'+f.id+'_y');
        if(dEl&&parts[0])dEl.value=parseInt(parts[0],10);
        if(mEl&&parts[1])mEl.value=parseInt(parts[1],10);
        if(yEl&&parts[2])yEl.value=parts[2];
      } else {
        const el=document.getElementById('q_'+f.id);if(el)el.value=v;
      }
    });}
    else if(stage.type==='choice'){
      const v=state[stage.id];
      if(v!=null){
        const arr=stage.multi?(Array.isArray(v)?v:[v]):[v];
        document.querySelectorAll(`.card[data-qid="${stage.id}"]`).forEach(c=>c.classList.toggle('selected',arr.includes(c.dataset.value)));
      }
      if(stage.otherField){
        const ofWrap=document.getElementById('of_'+stage.id);
        if(ofWrap)ofWrap.style.display=(state[stage.id]==='outro')?'block':'none';
        const ofInput=document.getElementById('q_'+stage.otherField);
        if(ofInput&&state[stage.otherField])ofInput.value=state[stage.otherField];
      }
    }
    else if(stage.type==='story'){if(state.story){const el=document.getElementById('q_story');if(el)el.value=state.story;}}
  });
}

function valueDisplay(stage,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '—';
  if(stage.type==='choice'&&stage.options){
    if(Array.isArray(v))return v.map(x=>{const o=stage.options.find(o=>o.v===x);return o?o.t:x;}).join(', ');
    const o=stage.options.find(o=>o.v===v);return o?o.t:v;
  }
  return v;
}
function renderSummary(){
  // Update voucher fields
  const guestEl=document.getElementById('voucherGuest');
  if(guestEl){
    const raw=(state.name||'').trim();
    guestEl.textContent=raw?raw.split(' ').slice(0,3).join(' '):'Hóspede Morro dos Anjos';
  }
  const dateEl=document.getElementById('voucherDate');
  if(dateEl){
    const now=new Date();
    dateEl.textContent=now.toLocaleDateString('pt-BR');
    if(!state.voucher_code){
      state.voucher_code='MDA-'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
    }
    const codeEl=document.getElementById('voucherCode');
    if(codeEl)codeEl.textContent=state.voucher_code;
  }
  saveState();

}

function fireConfetti(){
  const c=document.getElementById('confetti');c.innerHTML='';c.classList.add('show');
  const colors=['#00AEEF','#FFF7E6','#CB9C66','#F27466','#FAA0AA','#8DE0F2'];
  for(let i=0;i<60;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDelay=(Math.random()*1.2)+'s';
    s.style.transform=`rotate(${Math.random()*360}deg)`;
    c.appendChild(s);
  }
  setTimeout(()=>c.classList.remove('show'),3500);
}

function showForm(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('formWrap').classList.add('show');
  document.getElementById('topbar').classList.add('show');
  buildStages();
  setTimeout(()=>{const el=document.getElementById('q_'+STAGES[0].id);el&&el.focus();},300);
}
document.getElementById('startBtn').addEventListener('click',()=>{
  const chk=document.getElementById('consentChk');
  if(chk&&!chk.checked){toast('Marque a autorização de coleta de dados para continuar');return;}
  state.consent_lgpd={accepted:true,at:new Date().toISOString()};saveState();
  showForm();
});
document.getElementById('skipQ').addEventListener('click',()=>{
  let idx=0;formInner.querySelectorAll('.stage').forEach((s,i)=>{if(s.classList.contains('active'))idx=i;});
  if(idx<STAGES.length-1)goTo(idx+1);
});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('formWrap').classList.contains('show'))return;
  if(e.target.tagName==='TEXTAREA')return;
  let idx=0;formInner.querySelectorAll('.stage').forEach((s,i)=>{if(s.classList.contains('active'))idx=i;});
  if(e.key==='ArrowRight'&&idx<STAGES.length-1)tryAdvance(idx);
  if(e.key==='ArrowLeft'&&idx>0)goTo(idx-1);
});
</script>
</body>
</html>
